name: mini_project_3_ocr_expense_tracker
description: "OCR Expense Tracker & Receipt Parser with Flutter, Google ML Kit, SQLite, and CustomPainter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Icons & Typography
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Offline AI OCR
  google_mlkit_text_recognition: ^0.13.0

  # Camera & Media Selection
  camera: ^0.11.0+1
  image_picker: ^1.1.1

  # Local Database & Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # State Management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
